---
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout the tag"
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: "Check the README badge and package.json name this version"
        run: |
          grep -q "badge/release-${{ github.event.release.tag_name }}-" README.md
          test "$(node -p 'require("./package.json").version')" = "${{ github.event.release.tag_name }}"

      - name: "Pack the npm package and attach it"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release upload "${{ github.event.release.tag_name }}" browser-control-profiles-*.tgz --clobber
